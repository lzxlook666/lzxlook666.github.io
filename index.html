<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zixian Lei | Personal Page</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #e9e9e9;
      --accent: #4F80FF;
      --soft: #fafafa;
    }

    body.dark {
      --bg: #111111;
      --text: #f3f3f3;
      --muted: #b8b8b8;
      --line: #2a2a2a;
      --accent: #4F80FF;
      --soft: #171717;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    .page {
      width: min(860px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 56px;
      flex: 1;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .intro {
      max-width: 620px;
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 18px;
    }

    .card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--soft);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
    }

    .footer {
      border-top: 1px solid var(--line);
      padding: 22px 20px 28px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      background: var(--bg);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 10px;
      margin-bottom: 6px;
    }

    .stat-num {
      color: var(--accent);
      font-weight: 700;
    }

    .dot {
      color: var(--line);
    }

    .copyright {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .page {
        padding-top: 48px;
      }

      .dot {
        display: none;
      }

      .stats {
        flex-direction: column;
        gap: 2px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Personal Page</p>
    <h1>Zixian Lei</h1>
    <p class="intro">
      Welcome to my personal page. You can replace this part with your own content.
    </p>

    <section class="card">
      <h2>About</h2>
      <p>This is a placeholder section. Put your own introduction here.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="stats">
      <span id="busuanzi_container_site_pv">
        本站总访问量 <span id="busuanzi_value_site_pv" class="stat-num"></span> 次
      </span>
      <span class="dot">·</span>
      <span id="busuanzi_container_site_uv">
        本站访客数 <span id="busuanzi_value_site_uv" class="stat-num"></span> 人
      </span>
    </div>
    <p class="copyright">© <span id="year"></span> Zixian Lei</p>
  </footer>

  <!-- 不蒜子浏览量统计 -->
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
